apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
            # BONUS: Add GPU resource requests with a node selector or toleration for GPU nodes
            # Uncomment the following lines if you have a cluster with GPUs
            #   nvidia.com/gpu: "1"
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
            - name: storage-volume
              mountPath: /app/data
              subPath: data
            - name: storage-volume
              mountPath: /app/checkpoints
              subPath: checkpoints
      restartPolicy: Never
      volumes:
        - name: config-volume
          configMap:
            name: training-config
        - name: storage-volume
          persistentVolumeClaim:
            claimName: training-pvc
      # BONUS: Node selector or toleration for GPU nodes
      # Uncomment the following if using GPUs
      # tolerations:
      #   - key: "nvidia.com/gpu"
      #     operator: "Exists"
      #     effect: "NoSchedule"
